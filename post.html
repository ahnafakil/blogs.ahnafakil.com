<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#181F22" />

  <title>Reading — Blogs by Akil</title>
  <meta name="description" content="Essay from Ahnaf Akil." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/blog.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23181F22'/%3E%3Ctext x='50' y='65' font-family='serif' font-size='48' font-style='italic' fill='%23889DA9' text-anchor='middle'%3Ea%3C/text%3E%3C/svg%3E" />
</head>
<body>

  <nav class="nav" aria-label="Primary">
    <a href="index.html" class="nav-brand">
      <span class="dot" aria-hidden="true"></span>
      Blogs by Akil
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span>
    </button>
    <ul class="nav-links">
      <li><a href="index.html">All Posts</a></li>
      <li><a href="https://ahnafakil.com">Portfolio</a></li>
      <li><a href="https://ahnafakil.com/projects.html">Projects</a></li>
      <li><a href="https://ahnafakil.com/about.html">About</a></li>
      <li><a href="https://ahnafakil.com/contact.html">Contact</a></li>
    </ul>
  </nav>

  <section class="post-page">
    <div class="container-narrow">

      <a href="index.html" class="post-back">
        <span aria-hidden="true">←</span>
        Back to all posts
      </a>

      <!-- Cover image slot -->
      <div id="post-cover-slot"></div>

      <article class="glass post-article reveal" id="post-content">
        <p style="text-align:center; color: var(--text-tertiary); font-family: var(--font-mono); font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase;">
          Loading post...
        </p>
      </article>

      <div style="margin-top: var(--s-6); text-align: center;" class="reveal">
        <a href="index.html" class="btn">
          <span aria-hidden="true">←</span> Back to all posts
        </a>
      </div>

    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <span class="footer-brand">— Blogs by Akil</span>
        <span class="footer-meta">
          <span data-year>2026</span>
          <span class="sep">·</span>
          <a href="https://ahnafakil.com">ahnafakil.com</a>
        </span>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    (function () {
      'use strict';

      const article   = document.getElementById('post-content');
      const coverSlot = document.getElementById('post-cover-slot');
      const params    = new URLSearchParams(window.location.search);
      const slug      = params.get('slug');

      if (!slug) {
        article.innerHTML = `
          <h1>Post not found</h1>
          <p>It looks like you arrived here without a post slug. Try heading back to
          <a href="index.html" class="inline-link">all posts</a>.</p>`;
        return;
      }

      marked.setOptions({ breaks: true, gfm: true, headerIds: true });

      Promise.all([
        fetch('posts/posts.json', { cache: 'no-cache' }).then(r => r.json()),
        fetch(`posts/${encodeURIComponent(slug)}.md`, { cache: 'no-cache' })
          .then(r => {
            if (!r.ok) throw new Error('Post not found');
            return r.text();
          })
      ])
      .then(([posts, markdown]) => {
        const meta = (Array.isArray(posts) ? posts : [])
          .find(p => p.slug === slug);

        // Strip front-matter
        let body = markdown;
        const fm = body.match(/^---\s*[\s\S]*?---\s*/);
        if (fm) body = body.slice(fm[0].length);

        const dateStr = meta && meta.date
          ? new Date(meta.date).toLocaleDateString('en-US', {
              year: 'numeric', month: 'long', day: 'numeric'
            })
          : '';

        const titleStr = meta && meta.title ? meta.title : slug;
        const categoryStr = meta && meta.category
          ? `<span class="post-category-badge">${meta.category}</span>`
          : '';

        // Cover image
        if (meta && meta.cover && meta.cover.trim() !== '' && coverSlot) {
          coverSlot.innerHTML = `<img class="post-cover" src="${meta.cover}" alt="" />`;
        }

        // Update document title
        document.title = `${titleStr} — Blogs by Akil`;

        article.innerHTML = `
          ${dateStr ? `<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;"><time datetime="${meta.date}">${dateStr}</time>${categoryStr}</div>` : ''}
          <h1>${titleStr}</h1>
          ${marked.parse(body)}
        `;
      })
      .catch(err => {
        console.error(err);
        article.innerHTML = `
          <h1>Post not found</h1>
          <p>We couldn't load that post. It may have been moved or unpublished.
          Head back to <a href="index.html" class="inline-link">all posts</a>.</p>`;
      });

    })();
  </script>
</body>
</html>
